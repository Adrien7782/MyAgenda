# Vérifications à chaque envoi de code : types TypeScript, tests, compilation de l'interface.
name: Vérifications

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
        env:
          TZ: Europe/Paris
      - run: npm run build
      - name: Web app
        run: npm run build:web
