# Publie une nouvelle version de My Agenda : Windows, macOS, Android et la web app.
#
# Se déclenche quand un tag "vX.Y.Z" est envoyé sur GitHub (voir RELEASE.md) :
#   npm version minor        → 0.6.0 devient 0.7.0, commit + tag v0.7.0
#   git push --follow-tags   → envoie le tout, ce workflow démarre
# ou à la main : onglet Actions → « Publier une version » → Run workflow.
#
# Étapes :
#   1. prepare  : tests, vérifications, création de la Release en brouillon
#   2. build    : Windows (.exe) et macOS (.dmg, Intel + Apple Silicon) construits en parallèle,
#      android  : APK signé (workflow android.yml) — s'il échoue, la version sort sans Android
#   3. publish  : latest.json (fichier lu par les applications pour se mettre à jour),
#                 puis publication de la Release. Rien n'est visible tant que tout n'a pas réussi.
#   4. web      : la web app (GitHub Pages) passe sur la même version (workflow web.yml).

name: Publier une version

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
        env:
          TZ: Europe/Paris

      - name: Vérifier les secrets du dépôt
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASS: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SB_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SB_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -z "$KEY" ] && missing="$missing TAURI_SIGNING_PRIVATE_KEY"
          [ -z "$PASS" ] && missing="$missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          [ -z "$SB_URL" ] && missing="$missing VITE_SUPABASE_URL"
          [ -z "$SB_KEY" ] && missing="$missing VITE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants (Settings → Secrets and variables → Actions) :$missing"
            exit 1
          fi

      - name: Version
        id: version
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $V de package.json. Utilise 'npm version' pour créer le tag."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Notes de version
        run: |
          node scripts/release-notes.mjs > release-body.md
          printf '\n\n---\n\n' >> release-body.md
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
          sed "s#__WEB_APP_URL__#https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}/#g" .github/release-install.md >> release-body.md

      - name: Créer la Release (brouillon)
        id: release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const tag = `v${process.env.VERSION}`;
            const body = fs.readFileSync('release-body.md', 'utf8');
            const { owner, repo } = context.repo;
            const all = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            const existing = all.find((r) => r.tag_name === tag);
            if (existing && !existing.draft) {
              core.setFailed(`La version ${tag} est déjà publiée. Crée une nouvelle version avec "npm version patch".`);
              return;
            }
            let release = existing;
            if (release) {
              // Relance d'une publication ratée : on repart d'un brouillon vide.
              for (const a of release.assets) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
              await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, body });
            } else {
              ({ data: release } = await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha,
                name: `My Agenda ${tag}`, body, draft: true, prerelease: false,
              }));
            }
            core.setOutput('id', String(release.id));

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            rust_targets: ''
          - name: macOS
            os: macos-latest
            # Un seul .dmg qui fonctionne sur les Mac Intel et Apple Silicon (M1, M2…).
            args: --target universal-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Adresse des mises à jour (ce dépôt)
        shell: bash
        run: |
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace('__GITHUB_REPOSITORY__',process.env.GITHUB_REPOSITORY))"
          grep -n "releases/latest/download/latest.json" src-tauri/tauri.conf.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.name }}

      - run: npm ci

      - name: Construire, signer et envoyer dans la Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}
          # latest.json est assemblé une seule fois à la fin (job publish), pour les deux systèmes.
          includeUpdaterJson: false

  android:
    needs: prepare
    uses: ./.github/workflows/android.yml
    with:
      release_id: ${{ needs.prepare.outputs.release_id }}
    secrets: inherit

  publish:
    needs: [prepare, build, android]
    # Windows et macOS sont obligatoires ; Android est ajouté s'il a réussi.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: latest.json puis publication
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.RELEASE_ID);
            const tag = `v${process.env.VERSION}`;
            // Adresse DÉFINITIVE (avec le tag) : tant que la Release est en brouillon, GitHub donne
            // des liens provisoires « untagged-… » qui cessent de fonctionner une fois publiée.
            const finalUrl = (name) => `https://github.com/${owner}/${repo}/releases/download/${tag}/${encodeURIComponent(name)}`;
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id, per_page: 100 });

            async function text(asset) {
              const res = await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', {
                owner, repo, asset_id: asset.id, headers: { accept: 'application/octet-stream' },
              });
              return Buffer.from(res.data).toString('utf8').trim();
            }
            async function entry(test, label) {
              const bin = assets.find((a) => test(a.name) && !a.name.endsWith('.sig'));
              const sig = bin && assets.find((a) => a.name === `${bin.name}.sig`);
              if (!bin || !sig) throw new Error(`Fichier de mise à jour ${label} introuvable dans la Release.`);
              return { signature: await text(sig), url: finalUrl(bin.name) };
            }

            const windows = await entry((n) => /x64-setup\.exe$/i.test(n), 'Windows');
            // Android : pas de signature de mise à jour (Android vérifie lui-même la signature de l'APK).
            const apk = assets.find((a) => /_android\.apk$/i.test(a.name));
            if (!apk) core.warning("Pas d'APK Android dans cette version (construction Android en échec ?).");
            const mac = await entry((n) => /\.app\.tar\.gz$/i.test(n), 'macOS');
            // Notes affichées dans l'application : la partie avant "---" (sans le mode d'emploi d'installation).
            const body = fs.existsSync('CHANGELOG.md')
              ? require('child_process').execSync('node scripts/release-notes.mjs').toString().trim()
              : '';
            const latest = {
              version: process.env.VERSION,
              notes: body,
              pub_date: new Date().toISOString(),
              platforms: {
                'windows-x86_64': windows,
                'darwin-x86_64': mac,
                'darwin-aarch64': mac,
                ...(apk ? { android: { signature: '', url: finalUrl(apk.name) } } : {}),
              },
            };

            for (const a of assets.filter((a) => a.name === 'latest.json')) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
            }
            const data = Buffer.from(JSON.stringify(latest, null, 2));
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id, name: 'latest.json', data,
              headers: { 'content-type': 'application/json', 'content-length': data.length },
            });

            await github.rest.repos.updateRelease({ owner, repo, release_id, draft: false, make_latest: 'true' });

            // Contrôle final : les adresses lues par les applications répondent bien.
            const urls = [
              `https://github.com/${owner}/${repo}/releases/latest/download/latest.json`,
              ...new Set(Object.values(latest.platforms).map((p) => p.url)),
            ];
            for (const url of urls) {
              let ok = false;
              for (let i = 0; i < 6 && !ok; i++) {
                const res = await fetch(url, { method: 'HEAD', redirect: 'follow' });
                ok = res.ok;
                if (!ok) await new Promise((r) => setTimeout(r, 5000));
              }
              if (!ok) core.setFailed(`Adresse injoignable après publication : ${url}`);
              else core.info(`OK ${url}`);
            }
            core.notice(`My Agenda ${process.env.VERSION} publiée pour Windows et macOS.`);

  web:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/web.yml
    secrets: inherit
