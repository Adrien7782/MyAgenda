# Construit l'application Android (APK signé).
#
# Trois usages :
#   • Envoi (git push) sur une branche autre que main : APK de TEST construit automatiquement,
#     à télécharger dans la page de l'exécution (rubrique « Artifacts »). Rien n'est publié.
#   • Onglet Actions → « Android (APK) » → Run workflow : pareil, à la demande
#     (le bouton n'apparaît qu'une fois ce fichier présent sur main).
#   • Appelé par « Publier une version » : l'APK est ajouté à la Release.
name: Android (APK)

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release_id:
        type: string
        required: true

permissions:
  contents: write

# Plusieurs envois rapprochés sur la même branche : seul le dernier est construit.
concurrency:
  group: android-${{ github.ref }}-${{ inputs.release_id || 'test' }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets du dépôt
        shell: bash
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SB_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SB_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KS_PASS" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$SB_URL" ] && missing="$missing VITE_SUPABASE_URL"
          [ -z "$SB_KEY" ] && missing="$missing VITE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Secrets manquants (Settings → Secrets and variables → Actions) :$missing"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Le SDK Android et le NDK sont déjà installés sur les machines GitHub (ubuntu-latest).
      - name: SDK et NDK Android
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          if [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK="$ANDROID_NDK_LATEST_HOME"
          else
            NDK=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1)
          fi
          if [ -z "$NDK" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
            NDK="$SDK/ndk/27.2.12479018"
          fi
          echo "SDK : $SDK"
          echo "NDK : $NDK"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: android

      - run: npm ci

      - name: Préparer le projet Android (icônes, signature, alarmes, marges)
        shell: bash
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace('__GITHUB_REPOSITORY__',process.env.GITHUB_REPOSITORY))"
          npx tauri android init --ci
          npx tauri icon src-tauri/icons/app-icon.svg
          echo "$KS" | base64 -d > "$RUNNER_TEMP/my-agenda-android.jks"
          node scripts/android-prepare.mjs "$RUNNER_TEMP/my-agenda-android.jks" "$KS_PASS" my-agenda

      - name: Construire l'APK
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # L'application lit les nouvelles versions dans les Releases de ce dépôt.
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx tauri android build --apk

      - name: Nommer l'APK
        id: apk
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          SRC=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          if [ -z "$SRC" ]; then echo "::error::APK introuvable"; find src-tauri/gen/android/app/build/outputs -name '*.apk'; exit 1; fi
          case "$SRC" in *unsigned*) echo "::error::L'APK n'est pas signé : vérifie ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD"; exit 1;; esac
          NAME="My.Agenda_${V}_android.apk"
          cp "$SRC" "$NAME"
          ls -la "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: APK de test (à télécharger dans « Artifacts »)
        if: ${{ !inputs.release_id }}
        uses: actions/upload-artifact@v4
        with:
          name: my-agenda-android-test
          path: ${{ steps.apk.outputs.name }}
          retention-days: 14

      - name: Ajouter l'APK à la Release
        if: ${{ inputs.release_id }}
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          APK: ${{ steps.apk.outputs.name }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.RELEASE_ID);
            const name = process.env.APK;
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id, per_page: 100 });
            for (const a of assets.filter((a) => a.name === name)) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
            const data = fs.readFileSync(name);
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id, name, data,
              headers: { 'content-type': 'application/vnd.android.package-archive', 'content-length': data.length },
            });
            core.notice(`${name} ajouté à la Release.`);
