# Application ordinateur de TEST (Windows + Mac), construite à chaque envoi sur une branche autre que main.
#
# Sert à vérifier une nouveauté (ex. la commande vocale) avant de publier une version :
#   onglet Actions → « Ordinateur (test) » → exécution → rubrique « Artifacts » :
#     my-agenda-windows-test  → installeur .exe
#     my-agenda-mac-test      → .dmg (Mac Intel et Apple Silicon)
# Rien n'est publié : les utilisateurs ne voient rien. Installer le test remplace l'app de ton ordinateur
# (mêmes données) ; la prochaine vraie version la mettra à jour normalement.

name: Ordinateur (test)

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --bundles nsis
            rust_targets: ''
            files: src-tauri/target/release/bundle/nsis/*.exe
          - name: mac
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Adresse des mises à jour (ce dépôt)
        shell: bash
        run: node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace('__GITHUB_REPOSITORY__',process.env.GITHUB_REPOSITORY))"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: test-${{ matrix.name }}

      - run: npm ci

      - name: Construire
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx tauri build ${{ matrix.args }}

      # Tests du moteur vocal (conversion du son, filtres) sur le vrai système (après la construction de l'interface).
      - name: Tests Rust
        working-directory: src-tauri
        run: cargo test --lib voice

      - uses: actions/upload-artifact@v4
        with:
          name: my-agenda-${{ matrix.name }}-test
          path: ${{ matrix.files }}
          retention-days: 14
          if-no-files-found: error
